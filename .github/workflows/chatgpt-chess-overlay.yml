name: Build Chess22k Overlay APK

on:
  push:
    branches:
      - chatgpt/chess-overlay-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for AI model conversion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project
        run: |
          cat chatgpt-build/project.b64.part* | base64 -d > /tmp/chess-overlay.zip
          unzip -t /tmp/chess-overlay.zip
          rm -rf /tmp/chess-overlay
          mkdir -p /tmp/chess-overlay
          unzip -q /tmp/chess-overlay.zip -d /tmp/chess-overlay

      - name: Add chess22k 1.14 source
        run: |
          git clone --depth 1 https://github.com/sandermvdb/chess22k.git /tmp/chess22k
          cp -R /tmp/chess22k/src/main/java/nl /tmp/chess-overlay/BerserkOverlay/app/src/main/java/
          mkdir -p /tmp/chess-overlay/BerserkOverlay/app/src/main/assets
          if [ -f /tmp/chess22k/LICENSE ]; then
            cp /tmp/chess22k/LICENSE /tmp/chess-overlay/BerserkOverlay/app/src/main/assets/chess22k-GPL-3.0.txt
          fi
          printf '%s\n' 'chess22k upstream: https://github.com/sandermvdb/chess22k'             'Bundled under GPL-3.0. Source is available at the upstream URL above.'             > /tmp/chess-overlay/BerserkOverlay/app/src/main/assets/chess22k-source.txt

      - name: Add root-exclusion support for 1-3 alternatives
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/chess-overlay/BerserkOverlay/app/src/main/java/nl/s22k/chess/search/NegamaxUtil.java')
          s=p.read_text()
          needle='public static boolean isRunning = false;'
          addition='''public static boolean isRunning = false;

          private static volatile int[] ROOT_EXCLUDED_MOVES = new int[0];

          public static void setRootExcludedMoves(final int[] moves) {
              ROOT_EXCLUDED_MOVES = moves == null ? new int[0] : moves.clone();
          }

          private static boolean isRootMoveExcluded(final int move) {
              for (int excluded : ROOT_EXCLUDED_MOVES) {
                  if (excluded == move) {
                      return true;
                  }
              }
              return false;
          }'''
          if needle not in s:
              raise SystemExit('isRunning insertion point not found')
          s=s.replace(needle, addition, 1)
          needle2='final int move = threadData.next();'
          replacement='''final int move = threadData.next();

                  if (ply == 0 && isRootMoveExcluded(move)) {
                      continue;
                  }'''
          if needle2 not in s:
              raise SystemExit('root move insertion point not found')
          s=s.replace(needle2, replacement, 1)
          p.write_text(s)

          g=Path('/tmp/chess-overlay/BerserkOverlay/app/build.gradle.kts')
          gs=g.read_text()
          marker='''    defaultConfig {
                  applicationId = "com.example.berserkoverlay"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"

              }'''
          replacement2='''    defaultConfig {
                  applicationId = "com.example.berserkoverlay"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }'''
          if marker in gs:
              gs=gs.replace(marker,replacement2,1)
          else:
              gs=gs.replace('\n}\n\ndependencies {','''

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {''',1)
          g.write_text(gs)
          PY

      - name: Apply v5 AI auto-detection overlay
        run: |
          cat "$GITHUB_WORKSPACE"/chatgpt-build/v5patches.b64.part* | base64 -d > /tmp/v5patches.zip
          rm -rf /tmp/v5patches
          mkdir -p /tmp/v5patches
          unzip -q /tmp/v5patches.zip -d /tmp/v5patches

          cp /tmp/v5patches/AiBoardRecognizer.kt /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/AiBoardRecognizer.kt
          cp /tmp/v5patches/OverlayService.kt /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/OverlayService.kt
          cp /tmp/v5patches/MainActivity.kt /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/MainActivity.kt
          cp /tmp/v5patches/activity_main.xml /tmp/chess-overlay/BerserkOverlay/app/src/main/res/layout/activity_main.xml

      - name: Upload v5 source patches for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: v5-source-patches
          path: /tmp/v5patches
          retention-days: 1

      - name: Re-enter v5 AI patch setup
        run: |
          true

          # Keep the v4 arrow renderer and fresh-frame generation counter.
          cp "$GITHUB_WORKSPACE/chatgpt-build/patches/v4/BoardOverlayView.kt" /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/BoardOverlayView.kt
          cp "$GITHUB_WORKSPACE/chatgpt-build/patches/v4/ProjectionStore.kt" /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/ProjectionStore.kt

          python3 - <<'PY'
          from pathlib import Path
          styles=Path('/tmp/chess-overlay/BerserkOverlay/app/src/main/res/values/styles.xml')
          s=styles.read_text().replace(
              'parent="android:style/Theme.Material.Light.NoActionBar"',
              'parent="Theme.AppCompat.Light.NoActionBar"'
          )
          styles.write_text(s)

          manifest=Path('/tmp/chess-overlay/BerserkOverlay/app/src/main/AndroidManifest.xml')
          m=manifest.read_text().replace('android:label="Berserk Overlay"', 'android:label="Chess22k AI Overlay"')
          manifest.write_text(m)

          gradle=Path('/tmp/chess-overlay/BerserkOverlay/app/build.gradle.kts')
          g=gradle.read_text()
          g=g.replace('versionCode = 1', 'versionCode = 5')
          g=g.replace('versionName = "0.1.0"', 'versionName = "0.5.0"')
          if 'org.tensorflow:tensorflow-lite' not in g:
              g=g.replace(
                  'dependencies {',
                  'dependencies {\n    implementation("org.tensorflow:tensorflow-lite:2.17.0")'
              )
          gradle.write_text(g)
          PY

      - name: Fix MediaProjection static-frame fallback
        run: |
          python3 "$GITHUB_WORKSPACE/chatgpt-build/patch_capture_fallback.py"             /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/OverlayService.kt             /tmp/chess-overlay/BerserkOverlay/app/build.gradle.kts

      - name: Fix overlay arrow redraw
        run: |
          python3 "$GITHUB_WORKSPACE/chatgpt-build/patch_arrow_redraw.py"             /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/OverlayService.kt             /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/BoardOverlayView.kt             /tmp/chess-overlay/BerserkOverlay/app/build.gradle.kts

      - name: Fix full-screen capture and first-frame handshake
        run: |
          base64 -d "$GITHUB_WORKSPACE/chatgpt-build/v8patches.b64" > /tmp/v8patches.zip
          rm -rf /tmp/v8patches
          mkdir -p /tmp/v8patches
          unzip -q /tmp/v8patches.zip -d /tmp/v8patches
          cp /tmp/v8patches/MainActivity.kt /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/MainActivity.kt
          cp /tmp/v8patches/ProjectionService.kt /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/ProjectionService.kt
          cp /tmp/v8patches/ProjectionStore.kt /tmp/chess-overlay/BerserkOverlay/app/src/main/java/com/example/berserkoverlay/ProjectionStore.kt
          python3 - <<'PY'
          from pathlib import Path
          g=Path('/tmp/chess-overlay/BerserkOverlay/app/build.gradle.kts')
          s=g.read_text().replace('versionCode = 7','versionCode = 8').replace('versionName = "0.7.0"','versionName = "0.8.0"')
          g.write_text(s)
          PY

      - name: Switch v9 to Accessibility tree input
        run: |
          python3 "$GITHUB_WORKSPACE/chatgpt-build/apply_v9.py"             /tmp/chess-overlay/BerserkOverlay             "$GITHUB_WORKSPACE/chatgpt-build/v9patches.b64"

      - name: Apply v10 reliable click and accessibility parsing
        run: |
          python3 "$GITHUB_WORKSPACE/chatgpt-build/apply_v10.py"             /tmp/chess-overlay/BerserkOverlay             "$GITHUB_WORKSPACE/chatgpt-build/v10patches.b64"

      - name: Convert pretrained chess CNN to TensorFlow Lite
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet tensorflow-cpu==2.15.1
          curl -L --fail --retry 3             https://github.com/linrock/chessboard-recognizer/releases/download/v0.5/nn.zip             -o /tmp/chess-nn.zip
          rm -rf /tmp/chess-nn
          mkdir -p /tmp/chess-nn
          unzip -q /tmp/chess-nn.zip -d /tmp/chess-nn
          mkdir -p /tmp/chess-overlay/BerserkOverlay/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import tensorflow as tf

          roots=list(Path('/tmp/chess-nn').glob('**/model.tf'))
          if not roots:
              raise SystemExit('model.tf not found in nn.zip')
          model_path=roots[0]
          converter=tf.lite.TFLiteConverter.from_saved_model(str(model_path))
          tflite_model=converter.convert()
          out=Path('/tmp/chess-overlay/BerserkOverlay/app/src/main/assets/chess_piece_classifier.tflite')
          out.write_bytes(tflite_model)
          print('TFLite model bytes:', out.stat().st_size)
          PY
          curl -L --fail             https://raw.githubusercontent.com/linrock/chessboard-recognizer/master/LICENSE             -o /tmp/chess-overlay/BerserkOverlay/app/src/main/assets/chessboard-recognizer-MIT.txt
          printf '%s\n'             'Piece classifier derived from linrock/chessboard-recognizer v0.5 (MIT).'             'Source: https://github.com/linrock/chessboard-recognizer'             > /tmp/chess-overlay/BerserkOverlay/app/src/main/assets/chess-ai-source.txt

      - name: Build debug APK
        working-directory: /tmp/chess-overlay/BerserkOverlay
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          cp /tmp/chess-overlay/BerserkOverlay/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Chess22kOverlay.apk"
          sha256sum "$GITHUB_WORKSPACE/Chess22kOverlay.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess22kOverlay-v10-accessibility-fix-APK
          path: Chess22kOverlay.apk
          if-no-files-found: error
          retention-days: 7
